<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Party Planner</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Monoton&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
        <style>
            :root {
                --bg: #0b0618;
                --bg-glow: #2a0f4a;
                --panel: rgba(22, 12, 44, 0.78);
                --panel-edge: rgba(255, 255, 255, 0.08);
                --text: #f6f1ff;
                --muted: #b3a6d6;
                --pink: #ff4fd8;
                --cyan: #3ce7ff;
                --gold: #ffd23f;
                --lime: #9dff5c;
                --orange: #ff8a3d;
                --error: #ff6b6b;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "Fredoka", system-ui, sans-serif;
                color: var(--text);
                background:
                    radial-gradient(ellipse at 50% -10%, var(--bg-glow), transparent 60%),
                    var(--bg);
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 4.5rem 1rem 1.5rem;
                overflow-x: hidden;
            }

            /* --- Background: sparkles and ambient confetti --- */

            .beams,
            #confetti {
                position: fixed;
                inset: 0;
                pointer-events: none;
            }
            .beams {
                z-index: 0;
                overflow: hidden;
            }
            .sparkle {
                position: absolute;
                width: 4px;
                height: 4px;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8);
                opacity: 0;
                animation: twinkle 3s ease-in-out infinite;
            }
            @keyframes twinkle {
                50% {
                    opacity: 0.9;
                    transform: scale(1.4);
                }
            }
            #confetti {
                z-index: 1;
                overflow: hidden;
            }
            .confetti-piece {
                position: absolute;
                top: -20px;
                width: 8px;
                height: 14px;
                border-radius: 2px;
                opacity: 0.85;
                animation: fall linear infinite;
            }
            @keyframes fall {
                to {
                    transform: translate(var(--drift), 110vh) rotate(var(--spin));
                }
            }

            /* --- Chat panel --- */

            #container {
                position: relative;
                z-index: 2;
                width: 100%;
                max-width: 880px;
                height: min(880px, calc(100dvh - 6rem));
                display: flex;
                flex-direction: column;
                background: var(--panel);
                backdrop-filter: blur(14px);
                -webkit-backdrop-filter: blur(14px);
                border: 1px solid #fff;
                border-radius: 24px;
            }

            /* --- Disco ball --- */

            .disco-wrap {
                position: absolute;
                top: -4.5rem;
                right: 2.5rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                transform-origin: top center;
                animation: swing 4s ease-in-out infinite;
                z-index: 3;
            }
            .disco-wrap::before {
                content: "";
                width: 2px;
                height: 2.25rem;
                background: linear-gradient(#777, #ccc);
            }
            .disco {
                position: relative;
                width: 72px;
                height: 72px;
                border-radius: 50%;
                background:
                    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95) 0 5%, transparent 28%),
                    repeating-linear-gradient(0deg, rgba(20, 10, 40, 0.45) 0 1px, transparent 1px 8px),
                    repeating-linear-gradient(90deg, rgba(20, 10, 40, 0.45) 0 1px, transparent 1px 8px),
                    conic-gradient(#e9e4ff, #9aa3b8, #ffffff, #b8a6ff, #8fe9ff, #ffffff, #c9c9d6, #e9e4ff);
                box-shadow:
                    inset -10px -12px 20px rgba(0, 0, 0, 0.55),
                    0 0 30px rgba(255, 255, 255, 0.35);
                animation: spin 3s linear infinite;
            }
            @keyframes spin {
                to {
                    background-position: 0 0, 0 0, 64px 0, 0 0;
                }
            }
            .disco::after {
                content: "✦";
                position: absolute;
                top: 8px;
                right: 6px;
                font-size: 14px;
                color: #fff;
                text-shadow: 0 0 6px #fff;
                animation: twinkle 1.6s ease-in-out infinite;
            }
            @keyframes swing {
                0%,
                100% {
                    transform: rotate(5deg);
                }
                50% {
                    transform: rotate(-5deg);
                }
            }

            /* --- Header --- */

            header {
                padding: 1.75rem 2rem 1.25rem;
                border-bottom: 1px solid var(--panel-edge);
            }
            h1,
            .tagline {
                /* Leave room for the disco ball */
                padding-right: 7rem;
            }
            h1 {
                font-family: "Monoton", "Fredoka", cursive;
                font-weight: 400;
                font-size: clamp(1.9rem, 5vw, 2.8rem);
                letter-spacing: 0.04em;
                line-height: 1.1;
                background: linear-gradient(90deg, var(--pink), var(--gold), var(--cyan));
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }
            .tagline {
                margin-top: 0.4rem;
                color: var(--muted);
                font-size: 0.98rem;
                line-height: 1.45;
            }
            .header-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                margin-top: 1rem;
                flex-wrap: wrap;
            }
            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .chip {
                font: inherit;
                font-size: 0.85rem;
                color: var(--text);
                background: rgba(255, 255, 255, 0.06);
                border: 1px solid #fff;
                border-radius: 999px;
                padding: 0.4rem 0.85rem;
                cursor: pointer;
                transition: transform 0.15s, border-color 0.15s, background 0.15s;
            }
            .chip:hover {
                transform: translateY(-2px);
                border-color: var(--pink);
                background: rgba(255, 79, 216, 0.14);
            }

            /* --- Messages --- */

            #messages {
                flex: 1;
                overflow-y: auto;
                padding: 1.5rem 2rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
            }
            .msg {
                line-height: 1.55;
                max-width: 82%;
                padding: 0.8rem 1.1rem;
                border-radius: 18px;
                animation: pop 0.25s ease-out;
            }
            @keyframes pop {
                from {
                    opacity: 0;
                    transform: translateY(6px) scale(0.98);
                }
            }
            .msg.user {
                align-self: flex-end;
                background: linear-gradient(135deg, var(--pink), #9b5cff);
                border-bottom-right-radius: 6px;
                color: #fff;
            }
            .msg.assistant {
                align-self: flex-start;
                background: rgba(255, 255, 255, 0.07);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-bottom-left-radius: 6px;
            }
            .msg .role {
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                opacity: 0.7;
                margin-bottom: 0.2rem;
            }
            .msg .content {
                white-space: pre-wrap;
                word-break: break-word;
            }

            /* Rendered Markdown answers */
            .msg .content.md {
                white-space: normal;
            }
            .content.md > * + * {
                margin-top: 0.6rem;
            }
            .content.md h3 {
                font-size: 1rem;
                font-weight: 600;
                color: var(--gold);
                margin-top: 1rem;
            }
            .content.md h3:first-child {
                margin-top: 0;
            }
            .content.md ul,
            .content.md ol {
                padding-left: 1.3rem;
            }
            .content.md li + li {
                margin-top: 0.25rem;
            }
            .content.md li::marker {
                color: var(--pink);
            }
            .content.md strong {
                font-weight: 600;
            }

            /* Loading: a tiny spinning disco ball */
            .mini-disco {
                display: inline-block;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                vertical-align: -4px;
                background:
                    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95) 0 6%, transparent 35%),
                    repeating-linear-gradient(0deg, rgba(20, 10, 40, 0.5) 0 1px, transparent 1px 4px),
                    repeating-linear-gradient(90deg, rgba(20, 10, 40, 0.5) 0 1px, transparent 1px 4px),
                    conic-gradient(#e9e4ff, #9aa3b8, #ffffff, #b8a6ff, #8fe9ff, #ffffff, #c9c9d6, #e9e4ff);
                box-shadow:
                    inset -3px -4px 6px rgba(0, 0, 0, 0.55),
                    0 0 8px rgba(255, 255, 255, 0.35);
                animation: mini-spin 1s linear infinite;
            }
            @keyframes mini-spin {
                to {
                    background-position: 0 0, 0 0, 16px 0, 0 0;
                }
            }
            .loading-text {
                margin-left: 0.5rem;
                color: var(--muted);
                font-size: 0.9rem;
            }

            /* --- Tool call cards --- */

            .tools {
                align-self: flex-start;
                max-width: 82%;
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
            }
            .tool {
                border-radius: 12px;
                background: rgba(0, 0, 0, 0.3);
                border: 1px dashed rgba(255, 255, 255, 0.22);
                border-left: 4px solid var(--accent, var(--gold));
                font-size: 0.85rem;
                animation: pop 0.25s ease-out;
            }
            .tool summary {
                cursor: pointer;
                padding: 0.5rem 0.8rem;
                list-style: none;
                display: flex;
                align-items: baseline;
                gap: 0.5rem;
                flex-wrap: wrap;
            }
            .tool summary::-webkit-details-marker {
                display: none;
            }
            .tool summary::after {
                content: "▸";
                margin-left: auto;
                color: var(--muted);
                transition: transform 0.15s;
            }
            .tool[open] summary::after {
                transform: rotate(90deg);
            }
            .tool .tool-name {
                font-weight: 600;
                color: var(--accent, var(--gold));
            }
            .tool .tool-args {
                color: var(--muted);
                font-family: ui-monospace, monospace;
                font-size: 0.78rem;
            }
            .tool pre {
                margin: 0 0.8rem 0.7rem;
                padding: 0.6rem 0.75rem;
                border-radius: 8px;
                background: rgba(0, 0, 0, 0.35);
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #e4dcff;
                white-space: pre-wrap;
                word-break: break-word;
                max-height: 260px;
                overflow: auto;
            }
            .tool.error {
                --accent: var(--error);
            }

            /* --- Input --- */

            #input-area {
                display: flex;
                gap: 0.75rem;
                padding: 1rem 1.25rem 1.25rem;
                border-top: 1px solid var(--panel-edge);
            }
            #user-input {
                flex: 1;
                min-width: 0;
                padding: 0.8rem 1.1rem;
                border-radius: 999px;
                border: 1px solid #fff;
                background: rgba(255, 255, 255, 0.06);
                color: var(--text);
                font: inherit;
                font-size: 1rem;
                outline: none;
                transition: border-color 0.15s, box-shadow 0.15s;
            }
            #user-input::placeholder {
                color: var(--muted);
            }
            #user-input:focus {
                border-color: #fff;
                box-shadow: 0 0 0 3px rgba(60, 231, 255, 0.2);
            }
            #send-btn {
                font: inherit;
                font-weight: 600;
                font-size: 0.95rem;
                padding: 0.75rem 1.4rem;
                border: none;
                border-radius: 999px;
                cursor: pointer;
                color: #1a0b2e;
                background: linear-gradient(135deg, var(--gold), var(--orange));
                box-shadow: 0 4px 18px rgba(255, 138, 61, 0.35);
                transition: transform 0.15s;
            }
            #send-btn:hover:not(:disabled) {
                transform: translateY(-1px) scale(1.03);
            }
            button:disabled {
                opacity: 0.4;
                cursor: default;
            }

            /* --- Respect reduced-motion settings --- */

            @media (prefers-reduced-motion: reduce) {
                .beams,
                #confetti {
                    display: none;
                }
                .disco,
                .disco-wrap,
                .disco::after {
                    animation: none;
                }
            }

            @media (max-width: 640px) {
                body {
                    padding: 4rem 0.75rem 0.75rem;
                }
                #container {
                    height: calc(100dvh - 4.75rem);
                    border-radius: 18px;
                }
                header {
                    padding: 1.25rem 1.1rem 0.9rem;
                }
                h1 {
                    padding-right: 4.5rem;
                }
                .tagline {
                    padding-right: 0;
                    font-size: 0.9rem;
                }
                .header-row {
                    margin-top: 0.75rem;
                    gap: 0.6rem;
                }
                /* One row of sample prompts that scrolls sideways */
                .chips {
                    flex-wrap: nowrap;
                    overflow-x: auto;
                    width: 100%;
                    scrollbar-width: none;
                }
                .chip {
                    white-space: nowrap;
                }
                #messages {
                    padding: 1rem;
                }
                .msg,
                .tools {
                    max-width: 92%;
                }
                .disco-wrap {
                    right: 1.25rem;
                    top: -4rem;
                }
                .disco {
                    width: 56px;
                    height: 56px;
                }
                #send-btn {
                    padding: 0.75rem 1.1rem;
                }
            }
        </style>
    </head>
    <body>
        <div class="beams" aria-hidden="true"></div>
        <div id="confetti" aria-hidden="true"></div>

        <div id="container">
            <div class="disco-wrap" aria-hidden="true"><div class="disco"></div></div>
            <header>
                <h1>Hi, I'm Pam!</h1>
                <h2>Let's plan your party.</h2>
                <p class="tagline">
                    Tell me when and where it's happening, roughly how many guests you're expecting, your budget, and any theme you have in mind.
                    I'll check the forecast, suggest food and drinks, figure out how much to buy, and keep everything within budget.
                </p>
                <div class="header-row">
                    <div class="chips" id="chips"></div>
                </div>
            </header>
            <div id="messages" aria-live="polite"></div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Describe your party..."
                    autocomplete="off"
                />
                <button id="send-btn">Let's party!</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            let sessionId = null;

            const COLORS = ["#ff4fd8", "#3ce7ff", "#ffd23f", "#9dff5c", "#ff8a3d", "#b18cff"];

            // How each tool shows up in the chat
            const TOOL_STYLE = {
                get_weather: { label: "Check current weather", color: "#3ce7ff" },
                check_party_date: { label: "Forecast for party date", color: "#9dff5c" },
                find_recipes: { label: "Food and drink ideas", color: "#ff4fd8" },
                estimate_supplies: { label: "Estimated supplies", color: "#ffd23f" },
                plan_budget: { label: "Budget plan", color: "#ff8a3d" },
            };

            const SAMPLES = [
                "Mexican rooftop dinner in New York this Saturday, 20 people, $250" ,
                "Is next Sunday good for a picnic in Chicago?",
                "Winter inspired cocktail ideas with tequila",
                "How much food should I buy for 4 hour dinner party with 40 guests?",
            ];

            // --- Background decorations ---

            function rand(min, max) {
                return min + Math.random() * (max - min);
            }

            const beams = document.querySelector(".beams");
            for (let i = 0; i < 24; i++) {
                const s = document.createElement("span");
                s.className = "sparkle";
                s.style.left = rand(0, 100) + "%";
                s.style.top = rand(0, 100) + "%";
                s.style.animationDelay = rand(0, 3) + "s";
                beams.appendChild(s);
            }

            const confetti = document.getElementById("confetti");
            for (let i = 0; i < 34; i++) {
                const p = document.createElement("span");
                p.className = "confetti-piece";
                p.style.left = rand(0, 100) + "%";
                p.style.background = COLORS[i % COLORS.length];
                p.style.animationDuration = rand(9, 18) + "s";
                p.style.animationDelay = -rand(0, 18) + "s";
                p.style.setProperty("--drift", rand(-80, 80) + "px");
                p.style.setProperty("--spin", rand(360, 1080) + "deg");
                if (i % 3 === 0) {
                    p.style.width = "8px";
                    p.style.height = "8px";
                    p.style.borderRadius = "50%";
                }
                confetti.appendChild(p);
            }

            // --- Chat ---

            function addMessage(role, text) {
                const div = document.createElement("div");
                div.className = "msg " + (role === "you" ? "user" : "assistant");
                const roleEl = document.createElement("div");
                roleEl.className = "role";
                roleEl.textContent = role === "you" ? "You" : "Pam";
                const content = document.createElement("div");
                content.className = "content";
                content.textContent = text;
                div.append(roleEl, content);
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            function renderMarkdown(el, text) {
                el.classList.add("md");
                el.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
            }

            function addLoading() {
                const div = addMessage("assistant", "");
                const content = div.querySelector(".content");
                content.innerHTML =
                    '<span class="mini-disco"></span>' +
                    '<span class="loading-text">Planning the party...</span>';
                return div;
            }

            function summarizeArgs(args) {
                return Object.entries(args || {})
                    .map(function ([k, v]) {
                        return k + ": " + (typeof v === "string" ? v : JSON.stringify(v));
                    })
                    .join(" · ");
            }

            function toolCard(call) {
                const style = TOOL_STYLE[call.name] || { icon: "🔧", label: call.name, color: "#ffd23f" };
                let pretty = call.result;
                let isError = false;
                try {
                    const parsed = JSON.parse(call.result);
                    pretty = JSON.stringify(parsed, null, 2);
                    isError = parsed && typeof parsed === "object" && "error" in parsed;
                } catch (e) {}

                const card = document.createElement("details");
                card.className = "tool" + (isError ? " error" : "");
                if (!isError) card.style.setProperty("--accent", style.color);

                const summary = document.createElement("summary");
                const name = document.createElement("span");
                name.className = "tool-name";
                name.textContent = (style.icon ? style.icon + " " : "") + style.label + (isError ? " (error)" : "");
                const args = document.createElement("span");
                args.className = "tool-args";
                args.textContent = call.name + "(" + summarizeArgs(call.args) + ")";
                summary.append(name, args);

                const pre = document.createElement("pre");
                pre.textContent = pretty;
                card.append(summary, pre);
                return card;
            }

            async function send(textOverride) {
                const text = (textOverride || userInput.value).trim();
                if (!text || sendBtn.disabled) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addLoading();

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Show each tool the harness ran, above the assistant's answer
                    const calls = data.tool_calls || [];
                    if (calls.length) {
                        const group = document.createElement("div");
                        group.className = "tools";
                        for (const call of calls) group.appendChild(toolCard(call));
                        messages.insertBefore(group, loading);
                    }
                    renderMarkdown(loading.querySelector(".content"), data.response);
                } catch (e) {
                    loading.querySelector(".content").textContent = "Error: " + e.message;
                }
                messages.scrollTop = messages.scrollHeight;
                sendBtn.disabled = false;
                userInput.focus();
            }

            const chips = document.getElementById("chips");
            for (const sample of SAMPLES) {
                const chip = document.createElement("button");
                chip.type = "button";
                chip.className = "chip";
                chip.textContent = sample;
                chip.addEventListener("click", function () {
                    send(sample);
                });
                chips.appendChild(chip);
            }

            addMessage(
                "assistant",
                "What are we celebrating? Share the city, date, number of guests and your budget, " +
                    "or pick one of the ideas above to get started. 🥂",
            );

            sendBtn.addEventListener("click", function () {
                send();
            });
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
