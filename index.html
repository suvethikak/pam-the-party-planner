<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Party Planner</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap"
            rel="stylesheet"
        />
        <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
        <style>
            :root {
                /* Taken from a candlelit New Year's Eve table: ivory walls, satin, silver, taper candles */
                --bg: #f4efe8;
                --panel: #fffdf9;
                --panel-edge: #e7dfd3;
                --text: #2f2a26;
                --muted: #8c8278;
                --ink: #2f2a26;
                --blush: #e3a9ae;
                --butter: #e6c873;
                --sage: #9fb19a;
                --taupe: #a8968a;
                --silver: #9ea3ab;
                --pine: #55705a;
                --wash: #f6f1ea;
                --error: #c0504d;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: "DM Sans", system-ui, sans-serif;
                color: var(--text);
                background:
                    radial-gradient(ellipse at 50% 110%, rgba(255, 214, 150, 0.35), transparent 55%),
                    radial-gradient(ellipse at 50% -20%, #ffffff, transparent 60%),
                    var(--bg);
                min-height: 100vh;
                min-height: 100dvh;
                display: flex;
                justify-content: center;
                align-items: center;
                padding: 4.5rem 1rem 1.5rem;
                overflow-x: hidden;
            }

            /* --- Background: silver paper stars hanging on threads --- */

            #stars {
                position: fixed;
                inset: 0;
                z-index: 0;
                overflow: hidden;
                pointer-events: none;
            }
            .hanging-star {
                position: absolute;
                top: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                transform-origin: top center;
                animation: sway ease-in-out infinite alternate;
            }
            .hanging-star::before {
                content: "";
                width: 1px;
                height: var(--thread);
                background: rgba(120, 108, 96, 0.35);
            }
            .hanging-star span {
                width: var(--size);
                height: var(--size);
                clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
                background: linear-gradient(135deg, #fbfbfb, #b9bdc4 45%, #eceef1 60%, #8f949c);
            }
            @keyframes sway {
                from {
                    transform: rotate(-3deg);
                }
                to {
                    transform: rotate(3deg);
                }
            }
            @keyframes twinkle {
                50% {
                    opacity: 0.9;
                    transform: scale(1.4);
                }
            }

            /* --- Chat panel --- */

            #container {
                position: relative;
                z-index: 2;
                width: 100%;
                max-width: 880px;
                height: min(880px, calc(100dvh - 6rem));
                display: flex;
                flex-direction: column;
                background: var(--panel);
                border: 1px solid var(--panel-edge);
                border-radius: 18px;
                box-shadow: 0 1px 2px rgba(60, 45, 30, 0.04), 0 18px 50px rgba(60, 45, 30, 0.1);
            }

            /* --- Disco ball --- */

            .disco-wrap {
                position: absolute;
                top: -4.5rem;
                right: 2.5rem;
                display: flex;
                flex-direction: column;
                align-items: center;
                transform-origin: top center;
                animation: swing 4s ease-in-out infinite;
                z-index: 3;
            }
            .disco-wrap::before {
                content: "";
                width: 2px;
                height: 2.25rem;
                background: rgba(120, 108, 96, 0.45);
            }
            .disco {
                position: relative;
                width: 72px;
                height: 72px;
                border-radius: 50%;
                background:
                    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95) 0 5%, transparent 28%),
                    repeating-linear-gradient(0deg, rgba(20, 10, 40, 0.45) 0 1px, transparent 1px 8px),
                    repeating-linear-gradient(90deg, rgba(20, 10, 40, 0.45) 0 1px, transparent 1px 8px),
                    conic-gradient(#f4f4f5, #9a9ca3, #ffffff, #c7c9ce, #8d9096, #ffffff, #b5b7bc, #f4f4f5);
                box-shadow:
                    inset -10px -12px 20px rgba(0, 0, 0, 0.35),
                    0 10px 24px rgba(60, 45, 30, 0.18);
                animation: spin 3s linear infinite;
            }
            @keyframes spin {
                to {
                    background-position: 0 0, 0 0, 64px 0, 0 0;
                }
            }
            .disco::after {
                content: "✦";
                position: absolute;
                top: 8px;
                right: 6px;
                font-size: 14px;
                color: #fff;
                text-shadow: 0 0 6px #fff;
                animation: twinkle 1.6s ease-in-out infinite;
            }
            @keyframes swing {
                0%,
                100% {
                    transform: rotate(5deg);
                }
                50% {
                    transform: rotate(-5deg);
                }
            }

            /* --- Header --- */

            header {
                padding: 1.75rem 2rem 1.25rem;
                border-bottom: 1px solid var(--panel-edge);
            }
            header h1,
            .tagline {
                /* Leave room for the disco ball */
                padding-right: 7rem;
            }
            header h1 {
                font-weight: 500;
                font-size: clamp(1.9rem, 5vw, 2.6rem);
                letter-spacing: -0.03em;
                line-height: 1.1;
                color: var(--ink);
            }
            header h2 {
                margin-top: 0.45rem;
                font-size: 0.75rem;
                font-weight: 500;
                text-transform: uppercase;
                letter-spacing: 0.2em;
                color: var(--taupe);
            }
            .tagline {
                margin-top: 0.4rem;
                color: var(--muted);
                font-size: 0.98rem;
                line-height: 1.45;
            }
            .header-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 1rem;
                margin-top: 1rem;
                flex-wrap: wrap;
            }
            .chips {
                display: flex;
                flex-wrap: wrap;
                gap: 0.5rem;
            }
            .chip {
                font: inherit;
                font-size: 0.85rem;
                color: var(--text);
                background: var(--panel);
                border: 1px solid var(--panel-edge);
                border-radius: 999px;
                padding: 0.4rem 0.85rem;
                cursor: pointer;
                transition: border-color 0.15s, background 0.15s;
            }
            .chip:hover {
                border-color: var(--blush);
                background: #fbeff0;
            }

            /* --- Messages --- */

            #messages {
                flex: 1;
                overflow-y: auto;
                padding: 1.5rem 2rem;
                display: flex;
                flex-direction: column;
                gap: 1rem;
                scrollbar-color: rgba(60, 45, 30, 0.2) transparent;
            }
            .msg {
                line-height: 1.55;
                max-width: 82%;
                padding: 0.8rem 1.1rem;
                border-radius: 18px;
                animation: pop 0.25s ease-out;
            }
            @keyframes pop {
                from {
                    opacity: 0;
                    transform: translateY(6px) scale(0.98);
                }
            }
            .msg.user {
                align-self: flex-end;
                background: var(--ink);
                border-bottom-right-radius: 6px;
                color: #fbf7f1;
            }
            .msg.assistant {
                align-self: flex-start;
                background: var(--wash);
                border: 1px solid var(--panel-edge);
                border-bottom-left-radius: 6px;
            }
            .msg .role {
                font-size: 0.72rem;
                text-transform: uppercase;
                letter-spacing: 0.08em;
                opacity: 0.7;
                margin-bottom: 0.2rem;
            }
            .msg .content {
                white-space: pre-wrap;
                word-break: break-word;
            }

            /* Rendered Markdown answers */
            .msg .content.md {
                white-space: normal;
            }
            .content.md > * + * {
                margin-top: 0.6rem;
            }
            .content.md h1,
            .content.md h2,
            .content.md h3 {
                font-size: 1rem;
                font-weight: 600;
                color: var(--pine);
                margin-top: 1rem;
            }
            .content.md h1 {
                font-size: 1.15rem;
            }
            .content.md :is(h1, h2, h3):first-child {
                margin-top: 0;
            }
            .content.md ul,
            .content.md ol {
                padding-left: 1.3rem;
            }
            .content.md li + li {
                margin-top: 0.25rem;
            }
            .content.md li::marker {
                color: var(--taupe);
            }
            .content.md strong {
                font-weight: 600;
            }

            /* Loading: a tiny spinning disco ball */
            .mini-disco {
                display: inline-block;
                width: 18px;
                height: 18px;
                border-radius: 50%;
                vertical-align: -4px;
                background:
                    radial-gradient(circle at 32% 28%, rgba(255, 255, 255, 0.95) 0 6%, transparent 35%),
                    repeating-linear-gradient(0deg, rgba(20, 10, 40, 0.5) 0 1px, transparent 1px 4px),
                    repeating-linear-gradient(90deg, rgba(20, 10, 40, 0.5) 0 1px, transparent 1px 4px),
                    conic-gradient(#f4f4f5, #9a9ca3, #ffffff, #c7c9ce, #8d9096, #ffffff, #b5b7bc, #f4f4f5);
                box-shadow: inset -3px -4px 6px rgba(0, 0, 0, 0.35);
                animation: mini-spin 1s linear infinite;
            }
            @keyframes mini-spin {
                to {
                    background-position: 0 0, 0 0, 16px 0, 0 0;
                }
            }
            .loading-text {
                margin-left: 0.5rem;
                color: var(--muted);
                font-size: 0.9rem;
            }

            /* --- Tool call cards --- */

            .tools {
                align-self: flex-start;
                max-width: 82%;
                display: flex;
                flex-direction: column;
                gap: 0.4rem;
            }
            .tool {
                border-radius: 12px;
                background: var(--panel);
                border: 1px solid var(--panel-edge);
                border-left: 3px solid var(--accent, var(--taupe));
                font-size: 0.85rem;
                animation: pop 0.25s ease-out;
            }
            .tool summary {
                cursor: pointer;
                padding: 0.5rem 0.8rem;
                list-style: none;
                display: flex;
                align-items: baseline;
                gap: 0.5rem;
                flex-wrap: wrap;
            }
            .tool summary::-webkit-details-marker {
                display: none;
            }
            .tool summary::after {
                content: "▸";
                margin-left: auto;
                color: var(--muted);
                transition: transform 0.15s;
            }
            .tool[open] > summary::after {
                transform: rotate(90deg);
            }
            .tool .tool-name {
                font-weight: 600;
                color: var(--ink);
            }
            .tool .tool-args {
                color: var(--muted);
                font-family: ui-monospace, monospace;
                font-size: 0.78rem;
            }
            .tool pre {
                margin: 0 0.8rem 0.7rem;
                padding: 0.6rem 0.75rem;
                border-radius: 8px;
                background: var(--wash);
                font-family: ui-monospace, monospace;
                font-size: 0.75rem;
                color: #5b524a;
                white-space: pre-wrap;
                word-break: break-word;
                max-height: 260px;
                overflow: auto;
            }
            .tool.error {
                --accent: var(--error);
            }

            /* --- Playlist inside a make_party_playlist card --- */

            .playlist {
                margin: 0 0.8rem 0.7rem;
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
            }
            .songs {
                display: flex;
                flex-direction: column;
                gap: 0.35rem;
                max-height: 360px;
                overflow-y: auto;
                scrollbar-color: rgba(60, 45, 30, 0.2) transparent;
            }
            .playlist-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 0.5rem;
                color: var(--muted);
                font-size: 0.8rem;
                margin-bottom: 0.2rem;
            }
            .copy-btn {
                font: inherit;
                font-size: 0.75rem;
                color: var(--text);
                background: var(--panel);
                border: 1px solid var(--panel-edge);
                border-radius: 999px;
                padding: 0.2rem 0.7rem;
                cursor: pointer;
            }
            .song {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                padding: 0.35rem 0.5rem;
                border-radius: 10px;
                background: var(--wash);
            }
            .song.playing {
                background: #fbeff0;
            }
            .song img {
                width: 40px;
                height: 40px;
                border-radius: 6px;
                flex-shrink: 0;
            }
            .song .play {
                width: 32px;
                height: 32px;
                flex-shrink: 0;
                border: none;
                border-radius: 50%;
                background: var(--ink);
                color: #fbf7f1;
                font-size: 0.75rem;
                cursor: pointer;
            }
            .song .info {
                flex: 1;
                min-width: 0;
            }
            .song .title {
                font-weight: 500;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .song .meta,
            .song a {
                color: var(--muted);
                font-size: 0.75rem;
            }
            .song a {
                flex-shrink: 0;
            }
            .tool .raw > summary {
                padding: 0.3rem 0.8rem 0.5rem;
                color: var(--muted);
                font-size: 0.75rem;
            }

            /* The disco ball spins faster while a song preview plays */
            body.music .disco {
                animation-duration: 0.8s;
            }
            body.music .disco-wrap {
                animation-duration: 1.2s;
            }

            /* --- Input --- */

            #input-area {
                display: flex;
                gap: 0.75rem;
                padding: 1rem 1.25rem 1.25rem;
                border-top: 1px solid var(--panel-edge);
            }
            #user-input {
                flex: 1;
                min-width: 0;
                padding: 0.8rem 1.1rem;
                border-radius: 999px;
                border: 1px solid var(--panel-edge);
                background: var(--wash);
                color: var(--text);
                font: inherit;
                font-size: 1rem;
                outline: none;
                transition: border-color 0.15s, box-shadow 0.15s;
            }
            #user-input::placeholder {
                color: var(--muted);
            }
            #user-input:focus {
                border-color: var(--taupe);
                box-shadow: 0 0 0 3px rgba(168, 150, 138, 0.18);
            }
            #send-btn {
                font: inherit;
                font-weight: 500;
                font-size: 0.95rem;
                padding: 0.75rem 1.4rem;
                border: none;
                border-radius: 999px;
                cursor: pointer;
                color: #fbf7f1;
                background: var(--ink);
                transition: transform 0.15s;
            }
            #send-btn:hover:not(:disabled) {
                background: #4a423b;
            }
            button:disabled {
                opacity: 0.4;
                cursor: default;
            }

            /* --- Respect reduced-motion settings --- */

            @media (prefers-reduced-motion: reduce) {
                .hanging-star,
                .disco,
                .disco-wrap,
                .disco::after {
                    animation: none;
                }
            }

            @media (max-width: 640px) {
                body {
                    padding: 4rem 0.75rem 0.75rem;
                }
                #container {
                    height: calc(100dvh - 4.75rem);
                    border-radius: 18px;
                }
                header {
                    padding: 1.25rem 1.1rem 0.9rem;
                }
                header h1 {
                    padding-right: 4.5rem;
                }
                .tagline {
                    padding-right: 0;
                    font-size: 0.9rem;
                }
                .header-row {
                    margin-top: 0.75rem;
                    gap: 0.6rem;
                }
                /* One row of sample prompts that scrolls sideways */
                .chips {
                    flex-wrap: nowrap;
                    overflow-x: auto;
                    width: 100%;
                    scrollbar-width: none;
                }
                .chip {
                    white-space: nowrap;
                }
                #messages {
                    padding: 1rem;
                }
                .msg,
                .tools {
                    max-width: 92%;
                }
                .disco-wrap {
                    right: 1.25rem;
                    top: -4rem;
                }
                .disco {
                    width: 56px;
                    height: 56px;
                }
                #send-btn {
                    padding: 0.75rem 1.1rem;
                }
            }
        </style>
    </head>
    <body>
        <div id="stars" aria-hidden="true"></div>

        <div id="container">
            <div class="disco-wrap" aria-hidden="true"><div class="disco"></div></div>
            <header>
                <h1>Hi, I'm Pam!</h1>
                <h2>Let's plan your party.</h2>
                <p class="tagline">
                    Tell me when and where it's happening, roughly how many guests you're expecting, and any theme you have in mind.
                    I'll check the forecast, suggest food and drinks, figure out how much to buy, and put together a playlist you can preview right here.
                </p>
                <div class="header-row">
                    <div class="chips" id="chips"></div>
                </div>
            </header>
            <div id="messages" aria-live="polite"></div>
            <div id="input-area">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Describe your party..."
                    autocomplete="off"
                />
                <button id="send-btn">Let's party</button>
            </div>
        </div>
        <script>
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            let sessionId = null;

            // How each tool shows up in the chat
            const TOOL_STYLE = {
                get_weather: { label: "Check current weather", color: "#9ea3ab" },
                check_party_date: { label: "Forecast for party date", color: "#9fb19a" },
                find_recipes: { label: "Food and drink ideas", color: "#e3a9ae" },
                estimate_supplies: { label: "Estimated supplies", color: "#e6c873" },
                make_party_playlist: { label: "Party playlist", color: "#a8968a" },
            };

            const SAMPLES = [
                "Mexican rooftop dinner in New York this Saturday for 20 people",
                "90s throwback birthday in Chicago this Saturday, 15 people, 3 hours",
                "How many drinks should I buy for a housewarming with 30 people?",
            ];

            // --- Background decorations ---

            function rand(min, max) {
                return min + Math.random() * (max - min);
            }

            // Silver paper stars on threads of different lengths, like a garland hung from the ceiling
            const stars = document.getElementById("stars");
            for (let i = 0; i < 16; i++) {
                const star = document.createElement("div");
                star.className = "hanging-star";
                star.style.left = (i + rand(0.1, 0.9)) * (100 / 16) + "%";
                star.style.setProperty("--thread", rand(10, 170) + "px");
                star.style.setProperty("--size", rand(18, 34) + "px");
                star.style.animationDuration = rand(3, 6) + "s";
                star.style.animationDelay = -rand(0, 6) + "s";
                star.appendChild(document.createElement("span"));
                stars.appendChild(star);
            }

            // --- Chat ---

            function addMessage(role, text) {
                const div = document.createElement("div");
                div.className = "msg " + (role === "you" ? "user" : "assistant");
                const roleEl = document.createElement("div");
                roleEl.className = "role";
                roleEl.textContent = role === "you" ? "You" : "Pam";
                const content = document.createElement("div");
                content.className = "content";
                content.textContent = text;
                div.append(roleEl, content);
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            function renderMarkdown(el, text) {
                el.classList.add("md");
                el.innerHTML = DOMPurify.sanitize(marked.parse(text || ""));
            }

            function addLoading() {
                const div = addMessage("assistant", "");
                const content = div.querySelector(".content");
                content.innerHTML =
                    '<span class="mini-disco"></span>' +
                    '<span class="loading-text">Planning the party...</span>';
                return div;
            }

            function summarizeArgs(args) {
                return Object.entries(args || {})
                    .map(function ([k, v]) {
                        return k + ": " + (typeof v === "string" ? v : JSON.stringify(v));
                    })
                    .join(" · ");
            }

            function toolCard(call) {
                const style = TOOL_STYLE[call.name] || { label: call.name, color: "#a8968a" };
                let pretty = call.result;
                let isError = false;
                try {
                    const parsed = JSON.parse(call.result);
                    pretty = JSON.stringify(parsed, null, 2);
                    isError = parsed && typeof parsed === "object" && "error" in parsed;
                } catch (e) {}

                const card = document.createElement("details");
                card.className = "tool" + (isError ? " error" : "");
                if (!isError) card.style.setProperty("--accent", style.color);

                const summary = document.createElement("summary");
                const name = document.createElement("span");
                name.className = "tool-name";
                name.textContent = style.label + (isError ? " (error)" : "");
                const args = document.createElement("span");
                args.className = "tool-args";
                args.textContent = call.name + "(" + summarizeArgs(call.args) + ")";
                summary.append(name, args);

                const pre = document.createElement("pre");
                pre.textContent = pretty;

                if (!isError && call.name === "make_party_playlist") {
                    const raw = document.createElement("details");
                    raw.className = "raw";
                    const rawSummary = document.createElement("summary");
                    rawSummary.textContent = "Raw result";
                    raw.append(rawSummary, pre);
                    card.open = true;
                    card.append(summary, playlistView(JSON.parse(call.result)), raw);
                    return card;
                }
                card.append(summary, pre);
                return card;
            }

            // --- Song previews: one shared player, so starting a song stops the last one ---

            const audio = new Audio();
            let playingRow = null;

            function stopSong() {
                audio.pause();
                if (playingRow) {
                    playingRow.classList.remove("playing");
                    playingRow.querySelector(".play").textContent = "▶";
                }
                playingRow = null;
                document.body.classList.remove("music");
            }
            audio.addEventListener("ended", stopSong);

            function toggleSong(row, url) {
                const wasPlaying = playingRow === row;
                stopSong();
                if (wasPlaying) return;
                audio.src = url;
                audio.play();
                playingRow = row;
                row.classList.add("playing");
                row.querySelector(".play").textContent = "❚❚";
                document.body.classList.add("music");
            }

            function songRow(song) {
                const row = document.createElement("div");
                row.className = "song";

                const play = document.createElement("button");
                play.type = "button";
                play.className = "play";
                play.textContent = "▶";
                play.setAttribute("aria-label", "Preview " + song.title);
                if (song.preview) {
                    play.addEventListener("click", function () {
                        toggleSong(row, song.preview);
                    });
                } else {
                    play.disabled = true;
                }

                const art = document.createElement("img");
                art.src = song.artwork || "";
                art.alt = "";
                art.loading = "lazy";

                const info = document.createElement("div");
                info.className = "info";
                const title = document.createElement("div");
                title.className = "title";
                title.textContent = song.title;
                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = [song.artist, song.year, song.length].join(" · ");
                info.append(title, meta);

                row.append(play, art, info);
                if (song.link) {
                    const link = document.createElement("a");
                    link.href = song.link;
                    link.target = "_blank";
                    link.rel = "noopener";
                    link.textContent = "Apple Music ↗";
                    row.appendChild(link);
                }
                return row;
            }

            function playlistView(result) {
                const box = document.createElement("div");
                box.className = "playlist";

                const head = document.createElement("div");
                head.className = "playlist-head";
                const count = document.createElement("span");
                count.textContent =
                    result.songs.length + " songs · " + result.playlist_minutes + " of " + result.party_minutes + " min";
                const copy = document.createElement("button");
                copy.type = "button";
                copy.className = "copy-btn";
                copy.textContent = "Copy tracklist";
                copy.addEventListener("click", async function () {
                    const text = result.songs.map((s) => s.artist + " - " + s.title).join("\n");
                    try {
                        await navigator.clipboard.writeText(text);
                        copy.textContent = "Copied!";
                    } catch (e) {
                        copy.textContent = "Copy failed";
                    }
                    setTimeout(() => (copy.textContent = "Copy tracklist"), 1500);
                });
                head.append(count, copy);

                const list = document.createElement("div");
                list.className = "songs";
                for (const song of result.songs) list.appendChild(songRow(song));
                box.append(head, list);
                return box;
            }

            async function send(textOverride) {
                const text = (textOverride || userInput.value).trim();
                if (!text || sendBtn.disabled) return;

                userInput.value = "";
                sendBtn.disabled = true;
                addMessage("you", text);
                const loading = addLoading();

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Show each tool the harness ran, above the assistant's answer
                    const calls = data.tool_calls || [];
                    if (calls.length) {
                        const group = document.createElement("div");
                        group.className = "tools";
                        for (const call of calls) group.appendChild(toolCard(call));
                        messages.insertBefore(group, loading);
                    }
                    renderMarkdown(loading.querySelector(".content"), data.response);
                } catch (e) {
                    loading.querySelector(".content").textContent = "Error: " + e.message;
                }
                messages.scrollTop = messages.scrollHeight;
                sendBtn.disabled = false;
                userInput.focus();
            }

            const chips = document.getElementById("chips");
            for (const sample of SAMPLES) {
                const chip = document.createElement("button");
                chip.type = "button";
                chip.className = "chip";
                chip.textContent = sample;
                chip.addEventListener("click", function () {
                    send(sample);
                });
                chips.appendChild(chip);
            }

            addMessage(
                "assistant",
                "What are we celebrating? Share the city, date, number of guests and theme, " +
                    "or pick one of the ideas above to get started.",
            );

            sendBtn.addEventListener("click", function () {
                send();
            });
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
